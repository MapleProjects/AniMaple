name: animaple
description: "AniMaple — Anime streaming app"
publish_to: 'none'
version: 2.0.5+47

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  shared_preferences: ^2.3.5
  url_launcher: ^6.3.1
  video_view:
    path: video_view
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_windows_video: ^1.0.9
  media_kit_libs_linux: ^1.2.1
  window_manager: ^0.5.2
  wakelock_plus: ^1.2.8
  google_sign_in: ^6.2.2
  # 6.x usa silentSignIn sin ventanas emergentes de Credential Manager en Android
  connectivity_plus: ^6.0.0
  webview_flutter: ^4.14.1
  # OAuth de escritorio (Windows/Linux/macOS) para iniciar sesión con Google.
  # google_sign_in NO tiene plugin de Windows, así que en desktop se usa un
  # flujo Authorization Code + PKCE (loopback 127.0.0.1). Este crypto es solo
  # para generar el code_challenge de PKCE.
  crypto: ^3.0.3
  # Descargas offline: resuelve directorios de datos de la app (Android/desktop).
  path_provider: ^2.1.4
  encrypt: ^5.0.3
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

dependency_overrides:
  media_kit_video:
    path: packages/media_kit_video

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#0a0812"
  adaptive_icon_foreground: "assets/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/shaders/
